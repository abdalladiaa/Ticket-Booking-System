<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ticket Booking System</title>

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css"
      integrity="sha512-ApSLB1Pd3/bZN8fWB/RG9YhN/7bd9Hkf3AGaE2mPfebjrxagjuBtx2GcgdqIlJkUzwylBo61r9Xa9NmgBI0swA=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />

    <link rel="stylesheet" href="style/style.css" />
  </head>
  <body>
    <header class="navbar">
      <div class="container">
        <h1>
          <a href="#home">CINEMA</a>
        </h1>
        <nav>
          <ul class="d-flex">
            <li><a href="#home">Home</a></li>
            <li><a href="#movies">Movies</a></li>
            <li><a href="#booking">Booking</a></li>
          </ul>
        </nav>
        <div class="actions">
          <a href="#" id="cart-btn">
            <i class="fa-solid fa-cart-shopping"></i>
            <span id="cart-count" class="cart-count">0</span>
          </a>
          <a href="#">
            <i class="fa-solid fa-user"></i>
          </a>
        </div>
      </div>
    </header>

    <section id="home" class="hero">
      <div class="hero-overlay"></div>

      <div class="container hero-content">
        <div class="hero-text">
          <span class="hero-badge">
            <i class="fa-solid fa-film"></i>
            Your Cinema Experience
          </span>

          <h2>
            Your Movie.
            <span>Your Seat.</span>
            Your Experience.
          </h2>

          <p>
            Book your favorite movie, choose your ticket, pick your seat, and
            enjoy the ultimate cinema experience.
          </p>

          <div class="hero-actions">
            <a href="#booking" class="btn primary-btn">
              Book Your Ticket
              <i class="fa-solid fa-arrow-right"></i>
            </a>

            <a href="#movies" class="btn secondary-btn">
              <i class="fa-solid fa-play"></i>
              Explore Movies
            </a>
          </div>
        </div>
      </div>
    </section>

    <section id="movies" class="movies-section">
      <div class="container">
        <div class="section-header">
          <div>
            <span class="section-badge">Explore</span>
            <h2>Now Showing</h2>
          </div>
        </div>

        <div class="movies-grid">
        </div>
      </div>
    </section>

    <!-- Booking Section -->
    <section id="booking" class="booking-section hidden">
      <div class="container">
        <div class="section-header">
          <div>
            <span class="section-badge">Reservation</span>
            <h2>Book Your Ticket</h2>
          </div>
          <button id="back-to-movies" class="btn secondary-btn">
            <i class="fa-solid fa-arrow-left"></i> Back to Movies
          </button>
        </div>
        
        <!-- المكان اللي هيظهر فيه الفيلم اللي تم اختياره -->
        <div id="cart-items" class="movies-grid"></div>

        <div id="cart-actions" style="margin-top: 2rem; display: none; text-align: center;">
          <button id="confirm-booking" class="btn primary-btn" style="margin: auto;">
            Confirm Booking <i class="fa-solid fa-check"></i>
          </button>
        </div>
      </div>
    </section>

    <script src="index.js"></script>
  </body>
</html>
